<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120a1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Arkana: Reruntuhan Senja</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="vignette"></div>
  <div id="touchLayer"></div>
  <div id="dmgLayer"></div>
  <div id="cross"><i></i><i></i><i></i><i></i><b></b></div>

  <div id="hitDir"></div>
  <div id="top">
    <button class="pill room hidden" id="roomPill" aria-label="Bagikan kode room"></button>
    <div class="pill" id="rank">#1</div>
    <div class="pill big" id="timer">5:00</div>
    <div class="pill" id="myScore">0 / 20</div>
  </div>
  <canvas id="minimap" width="132" height="132"></canvas>
  <div id="feed"></div>
  <div id="net"></div>
  <button id="pauseBtn" aria-label="Menu">☰</button>
  <div id="toast"></div>

  <div id="zoneTag" class="hidden"></div>
  <div id="buffs"></div>
  <div id="status">
    <div id="lvl">1</div>
    <div class="bars">
      <div class="bar hp"><div id="hpFill"></div><span id="hpText">100</span></div>
      <div class="bar xp"><div id="xpFill"></div></div>
    </div>
  </div>

  <div id="stick"><div id="knob"></div></div>
  <button id="fireBtn" aria-label="Tembak"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="9" fill="none" stroke="currentColor" stroke-width="3"/><path d="M24 4v10M24 34v10M4 24h10M34 24h10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
  <button id="skillBtn" aria-label="Skill"><span id="skillName">Kilat</span><div id="skillCd"></div><em id="skillNum"></em></button>

  <div id="tutor" class="hidden" aria-live="polite">
    <div id="tutorDots"></div>
    <p id="tutorText"></p>
    <div class="tbtns"><button id="tutorSkip" class="ghost">Lewati latihan</button><button id="tutorGo" class="hidden">Masuk arena</button></div>
  </div>

  <div id="death" class="panel hidden"><h2>Kamu Gugur</h2><p id="deathBy"></p><p id="deathT"></p></div>
  <div id="score" class="panel hidden"><h2 id="scoreTitle">Papan Skor</h2><table id="scoreTable"></table><p id="scoreNext"></p></div>
  <div id="pause" class="panel hidden">
    <h2>Pengaturan</h2>
    <label>Kualitas grafis
      <select id="quality"><option value="low">Rendah</option><option value="medium">Sedang</option><option value="high">Tinggi</option></select>
    </label>
    <label>Sensitivitas bidik <input id="sens" type="range" min="0.4" max="2.2" step="0.1" value="1"></label>
    <label class="row"><input id="autoFire" type="checkbox"> Tembak otomatis saat bidikan mengenai lawan</label>
    <label class="row"><input id="aimAssist" type="checkbox"> Bantuan bidik</label>
    <label class="row"><input id="vibrate" type="checkbox"> Getar saat terkena dan menumbangkan lawan</label>
    <label class="row"><input id="mute" type="checkbox"> Matikan suara</label>
    <div class="btns"><button id="resume">Lanjut</button><button id="leave" class="ghost">Keluar ke menu</button></div>
  </div>
</div>

<div id="menu">
  <div class="card">
    <h1>ARKANA</h1>
    <h3>Reruntuhan Senja</h3>
    <input id="name" maxlength="14" placeholder="Nama pengembara" autocomplete="off" spellcheck="false">
    <div id="classes"></div>
    <button id="play">Masuk Arena</button>
    <div id="rooms">
      <div class="modes" role="radiogroup" aria-label="Mode room privat">
        <button class="mode on" data-gm="dm" role="radio" aria-checked="true">Deathmatch</button>
        <button class="mode" data-gm="koth" role="radio" aria-checked="false">Rebut Altar</button>
      </div>
      <button id="create" class="sec">Buat room privat</button>
      <div class="join"><input id="code" maxlength="4" placeholder="KODE" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Kode room"><button id="joinBtn" class="sec">Gabung</button></div>
    </div>
    <button id="practice" class="link">Latihan dan tutorial</button>
    <p id="menuMsg"></p>
    <p class="hint" id="hint"></p>
  </div>
</div>
<script type="module" src="dist/bundle.js"></script>
</body>
</html>
